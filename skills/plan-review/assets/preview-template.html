<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* UI preview: one section per screen, each with Before / After / Side by side and the numbered list of
   what changes. The mockups render inside sandboxed frames (no scripts), at the screen's own width,
   scaled down to fit; their styles never touch this page. Same tokens as the review page. */
:root {
  --bg: #ffffff;
  --bg-subtle: #f6f7f9;
  --bg-hover: #f0f2f5;
  --fg: #11141a;
  --fg-2: #353b47;
  --muted: #5d6471;
  --line: #e4e7ec;
  --line-strong: #cfd4dc;
  --accent: #3b4fd8;
  --accent-soft: #eef0fd;
  --ok: #157347;
  --ok-soft: #e6f4ec;
  --pend: #8f5600;
  --pend-soft: #fcf1de;
  --chg: #c0291b;
  --chg-soft: #fdebe8;
  --del: #b4321f;
  --del-soft: #fcece9;
  --add: #157347;
  --add-soft: #e6f4ec;
  --shadow: 0 1px 2px rgba(17, 20, 26, .06), 0 4px 12px rgba(17, 20, 26, .06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --bg-subtle: #15181d; --bg-hover: #1c2027; --fg: #e9ebef; --fg-2: #c3c8d1; --muted: #9098a6;
    --line: #252a32; --line-strong: #353b45; --accent: #8e9bff; --accent-soft: #1c2140;
    --ok: #55c58f; --ok-soft: #12291e; --pend: #e3ab4a; --pend-soft: #2e2412; --chg: #f2877a; --chg-soft: #351b18;
    --del: #f2877a; --del-soft: #351b18; --add: #55c58f; --add-soft: #12291e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --bg-subtle: #15181d; --bg-hover: #1c2027; --fg: #e9ebef; --fg-2: #c3c8d1; --muted: #9098a6;
  --line: #252a32; --line-strong: #353b45; --accent: #8e9bff; --accent-soft: #1c2140;
  --ok: #55c58f; --ok-soft: #12291e; --pend: #e3ab4a; --pend-soft: #2e2412; --chg: #f2877a; --chg-soft: #351b18;
  --del: #f2877a; --del-soft: #351b18; --add: #55c58f; --add-soft: #12291e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scrollbar-color: var(--line-strong) transparent; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2 { margin: 0; text-wrap: balance; color: var(--fg); }
h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 23px; line-height: 1.25; font-weight: 650; letter-spacing: -0.015em; }
p { margin: 0; max-width: 72ch; }
code { font-family: var(--mono); font-size: 0.84em; background: var(--bg-subtle); border: 1px solid var(--line); color: var(--fg); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
b { font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.topbar { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 max(20px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); font-size: 13.5px; }
.brand { font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.crumb-sep { color: var(--line-strong); }
.slug { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.hash { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); cursor: pointer; }

main { max-width: 1440px; margin: 0 auto; padding: 36px max(20px, env(safe-area-inset-right, 0px)) 96px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 64px; min-width: 0; }
.head { display: grid; gap: 14px; }
.plan-path { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; line-height: 1.4; padding: 3px 9px; border-radius: 999px; background: var(--bg-subtle); border: 1px solid var(--line); color: var(--fg-2); overflow-wrap: anywhere; text-decoration: none; }
.tag.warn { background: var(--pend-soft); border-color: color-mix(in srgb, var(--pend) 30%, transparent); color: var(--pend); font-weight: 550; }
.tag.mono { font-family: var(--mono); font-size: 12px; }
a.tag:hover { border-color: var(--accent); color: var(--accent); }
.note { font-size: 13px; color: var(--muted); max-width: 90ch; }
.screens-nav { display: flex; flex-wrap: wrap; gap: 6px; }

.screen { display: grid; gap: 16px; scroll-margin-top: calc(var(--top) + 16px); min-width: 0; }
.screen-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.route { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.where { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.where b { color: var(--fg-2); font-weight: 550; margin-right: 6px; }
.controls { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; align-items: flex-end; gap: 20px; }
.tabs [role="tab"] { all: unset; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); padding: 8px 0 9px; margin-bottom: -1px; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.tabs [role="tab"]:hover { color: var(--fg); }
.tabs [role="tab"][aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
/* States of one screen (loading, error, empty...): pills next to the view tabs. */
.states { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 9px; }
.states-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.states [role="tab"] { all: unset; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--fg-2); padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.states [role="tab"]:hover { border-color: var(--line-strong); }
.states [role="tab"][aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.states [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.stage { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 16px; align-items: start; min-width: 0; }
.pane { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pane-label { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.pane-label::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.pane[data-side="before"] .pane-label { color: var(--del); }
.pane[data-side="after"] .pane-label { color: var(--add); }
.frame { position: relative; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: #fff; box-shadow: var(--shadow); }
.frame iframe { border: 0; display: block; transform-origin: 0 0; background: #fff; }
.frame .none { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 14px; background: var(--bg-subtle); }

.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; position: sticky; top: calc(var(--top) + 16px); }
.marks-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.mark { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; font-size: 13.5px; line-height: 1.5; color: var(--fg-2); transition: border-color .15s, background-color .15s; }
.mark:hover { border-color: var(--line-strong); background: var(--bg-hover); }
.mark[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mark.other { opacity: .6; }
.mark.other:hover { opacity: .9; }
.num { width: 22px; height: 22px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.mark-text { color: var(--fg); }
.mark-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.mark-meta .w { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.badge.tbd { background: var(--pend-soft); color: var(--pend); }
.badge.stale { background: var(--chg-soft); color: var(--chg); }
.badge.side, .badge.st { background: var(--bg-subtle); border: 1px solid var(--line); color: var(--fg-2); font-weight: 500; }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; }

@media (max-width: 1100px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .marks { position: static; }
}
@media (max-width: 760px) {
  h1 { font-size: 25px; }
  .stage { --cols: 1 !important; }
  .top-right .hash { display: none; }
}
</style>

<div class="topbar">
  <span class="brand">UI preview</span><span class="crumb-sep">/</span><span class="slug" id="slug"></span>
  <div class="top-right">
    <span class="hash" id="top-hash"></span>
    <label class="toggle"><input type="checkbox" id="show-marks" checked> Highlights</label>
  </div>
</div>
<main id="main">
  <header class="head">
    <div class="plan-path" id="plan-path"></div>
    <h1 id="title"></h1>
    <div class="tags" id="tags"></div>
    <p class="note" id="disclaimer"></p>
    <nav class="screens-nav" id="screens-nav" aria-label="Screens"></nav>
  </header>
</main>

<script id="preview-data" type="application/json">__PREVIEW_JSON__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("preview-data").textContent);
  var main = document.getElementById("main");
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function md(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
  /* Slice and criterion links go to the review page when it is published; otherwise plain text. */
  function rlink(hash, text) { return D.review_url ? '<a href="' + esc(D.review_url) + "#" + esc(hash) + '" target="_blank" rel="noopener">' + esc(text) + "</a>" : esc(text); }
  function proof(s) {
    return esc(s).replace(/\bAC\s+\d+(?:\s*(?:,|–|-|\bto\b|\band\b|\ba\b|\be\b)\s*\d+)*/g, function (run) {
      return run.replace(/\d+/g, function (n) { return D.review_url ? '<a href="' + esc(D.review_url) + "#ac-" + n + '" target="_blank" rel="noopener">' + n + "</a>" : n; });
    });
  }

  /* What every mockup frame gets: a neutral base, the .ph placeholders for context that does not change,
     and the numbered highlights (red where something goes or changes today, green where it arrives). */
  var FRAME_BASE = "html,body{margin:0}body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#11141a;background:#fff;font-size:14px;line-height:1.5}" +
    ".ph{background:#e7e9ee;border-radius:6px;min-height:14px}.ph-line{height:10px;border-radius:4px;background:#e7e9ee;margin:8px 0}.ph-line.short{width:40%}" +
    "html.marks [data-mark]{outline:2px solid var(--mk);outline-offset:3px;border-radius:4px;position:relative;cursor:pointer}" +
    "html.marks [data-mark]::after{content:attr(data-mark);position:absolute;top:-11px;right:-11px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--mk);color:#fff;font:600 12px/20px system-ui,sans-serif;text-align:center;z-index:9}" +
    "html.marks [data-mark].flash{outline-width:4px;outline-offset:5px;transition:outline-width .2s,outline-offset .2s}";
  var MK = { before: "#b4321f", after: "#157347" };
  /* The fragment a side shows in a state: the state's own, or the screen's when the state has none. */
  function frag(sc, st, side) {
    var name = st && Object.prototype.hasOwnProperty.call(st, side) ? st[side] : sc[side];
    return name ? D.frags[name] : null;
  }
  function srcdoc(sc, html, side) {
    return '<!doctype html><html class="marks" style="--mk:' + MK[side] + '"><head><meta charset="utf-8"><style>' + FRAME_BASE + "</style>" +
      (sc.css ? "<style>" + D.frags[sc.css] + "</style>" : "") + "</head><body>" + html + "</body></html>";
  }
  function holds(m, state) { return !m.states || !m.states.length || !state || m.states.indexOf(state) >= 0; }

  var showMarks = store.get("ui-preview:marks") !== "off";
  var toggle = document.getElementById("show-marks");
  toggle.checked = showMarks;
  var frames = [];
  function fit(f) {
    var w = f.width, box = f.iframe.parentNode; if (!box) return;
    var scale = Math.min(1, box.clientWidth / w || 1);
    f.iframe.style.width = w + "px";
    f.iframe.style.transform = "scale(" + scale + ")";
    var doc = f.iframe.contentDocument, h = doc && doc.documentElement ? Math.max(doc.documentElement.scrollHeight, 120) : 480;
    f.iframe.style.height = h + "px";
    box.style.height = Math.ceil(h * scale) + "px";
    f.scale = scale;
  }

  /* ---------- header ---------- */
  var slugM = /features\/([^/]+)\//.exec(D.plan_path || "");
  document.getElementById("slug").textContent = slugM ? slugM[1] : D.plan_path;
  document.getElementById("top-hash").textContent = D.hash ? "plan.md " + D.hash : "";
  document.getElementById("plan-path").textContent = D.plan_path;
  document.getElementById("title").textContent = D.plan_title;
  document.getElementById("tags").innerHTML = '<span class="tag warn">illustrative mockup · not the plan</span>' +
    (D.review_url ? '<a class="tag" href="' + esc(D.review_url) + '" target="_blank" rel="noopener">Plan review page ↗</a>' : "") +
    (D.hash ? '<span class="tag mono">plan.md ' + esc(D.hash) + (D.generated ? " · generated " + esc(D.generated) : "") + "</span>" : "");
  document.getElementById("disclaimer").innerHTML = "Each screen is drawn by hand from reading the code" + (D.code_ref ? " at <code>" + esc(D.code_ref) + "</code>" : "") +
    " (Before) and the plan (After). It is not a screenshot: spacing and data are approximate, and what the plan does not fix shows as <b>not defined</b>. Grey blocks are parts of the screen that do not change. The plan is what counts.";
  document.getElementById("screens-nav").innerHTML = D.screens.length > 1 ? D.screens.map(function (sc) { return '<a class="tag" href="#screen-' + esc(sc.id) + '">' + esc(sc.name) + "</a>"; }).join("") : "";

  /* ---------- screens ---------- */
  D.screens.forEach(function (sc) {
    var el = document.createElement("section");
    el.className = "screen"; el.id = "screen-" + sc.id;
    var states = sc.states && sc.states.length ? sc.states : null;
    var state = states ? states[0].id : null;
    var anyBefore = !!sc.before || (states || []).some(function (s) { return s.before; });
    var anyAfter = !!sc.after || (states || []).some(function (s) { return s.after; });
    var both = anyBefore && anyAfter;
    var saved = store.get("ui-preview:view:" + sc.id);
    var mode = saved && (both || saved !== "both") ? saved : (both ? "both" : (anyAfter ? "after" : "before"));
    var views = [["before", "Before"], ["after", "After"], ["both", "Side by side"]];
    var marks = (sc.marks || []).slice().sort(function (a, b) { return a.n - b.n; });
    el.innerHTML = '<div class="screen-head"><h2>' + esc(sc.name) + "</h2>" + (sc.route ? '<span class="route">' + esc(sc.route) + "</span>" : "") + "</div>" +
      (sc.where ? '<div class="where"><b>Drawn from</b>' + esc(sc.where) + "</div>" : "") +
      '<div class="controls"><div class="tabs" role="tablist" aria-label="View of ' + esc(sc.name) + '">' + views.map(function (v) {
        return '<button type="button" role="tab" data-view="' + v[0] + '" aria-selected="' + (mode === v[0]) + '" tabindex="' + (mode === v[0] ? 0 : -1) + '">' + v[1] + "</button>";
      }).join("") + "</div>" +
      (states ? '<div class="states" role="tablist" aria-label="State of ' + esc(sc.name) + '"><span class="states-label">State</span>' + states.map(function (s, i) {
        return '<button type="button" role="tab" data-state="' + esc(s.id) + '" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '">' + esc(s.label) + "</button>";
      }).join("") + "</div>" : "") + "</div>" +
      '<div class="body"><div class="stage">' +
        '<div class="pane" data-side="before"><div class="pane-label">Before · today</div><div class="frame"></div></div>' +
        '<div class="pane" data-side="after"><div class="pane-label">After · with the plan</div><div class="frame"></div></div>' +
      "</div>" +
      '<ol class="marks" aria-label="What changes on ' + esc(sc.name) + '"></ol></div>';
    main.appendChild(el);

    var stage = el.querySelector(".stage"), list = el.querySelector(".marks");
    var pending = null;  /* mark to flash once the frames of the state it lives in have loaded */
    function stateLabel(id) { var s = (states || []).filter(function (x) { return x.id === id; })[0]; return s ? s.label : id; }
    /* Marks of the other states stay in the list, dimmed; a click on one switches to its state. */
    function renderMarks() {
      var here = marks.filter(function (m) { return holds(m, state); }).length;
      list.innerHTML = '<li class="marks-title">What changes' + (states ? " in this state" : "") + " (" + here + ")</li>" + marks.map(function (m) {
        var key = "mark:" + sc.id + ":" + m.n, other = !holds(m, state);
        return '<li><button type="button" class="mark' + (other ? " other" : "") + '" data-n="' + m.n + '" data-to="' + (other ? esc(m.states[0]) : "") + '" aria-pressed="false"><span class="num">' + m.n + "</span><span>" +
          '<span class="mark-text">' + md(m.text) + "</span>" + (m.tbd ? ' <span class="badge tbd" title="The plan does not fix this yet: the mockup shows a placeholder">not defined</span>' : "") +
          (D.stale[key] ? ' <span class="badge stale" title="The slice or criteria this was drawn from changed since the last publish">re-check: the plan changed here</span>' : "") +
          (other ? ' <span class="badge st">in: ' + esc(m.states.map(stateLabel).join(", ")) + "</span>" : "") +
          '<span class="mark-meta"><span>' + rlink("slice-" + m.s, m.s) + (D.slices[m.s] ? " · " + esc(D.slices[m.s]) : "") + "</span><span>" + proof(m.proof) + "</span>" +
          (m.where ? '<span class="w">' + esc(m.where) + "</span>" : "") + "</span></span></button></li>";
      }).join("");
    }
    function load(side) {
      var box = el.querySelector('.pane[data-side="' + side + '"] .frame');
      var st = (states || []).filter(function (s) { return s.id === state; })[0];
      var html = frag(sc, st, side);
      frames = frames.filter(function (f) { return !(f.screen === sc.id && f.side === side); });
      if (!html) {
        var whole = side === "before" ? !anyBefore : !anyAfter;
        box.innerHTML = '<div class="none">' + (side === "before" ? (whole ? "This screen does not exist today." : "This state does not exist today.") : (whole ? "This screen goes away with the plan." : "This state goes away with the plan.")) + "</div>";
        box.style.height = "";
        return;
      }
      box.innerHTML = '<iframe sandbox="allow-same-origin" title="' + esc(sc.name) + " · " + side + '" data-side="' + side + '"></iframe>';
      var ifr = box.firstChild, f = { iframe: ifr, width: sc.width || 1280, screen: sc.id, side: side, scale: 1 };
      frames.push(f);
      ifr.addEventListener("load", function () {
        var doc = ifr.contentDocument; if (!doc) return;
        doc.documentElement.classList.toggle("marks", showMarks);
        fit(f);
        /* A click on a highlight in the mockup selects its line in the list. */
        doc.addEventListener("click", function (e) {
          var t = e.target.closest && e.target.closest("[data-mark]"); if (!t) return;
          e.preventDefault(); select(t.getAttribute("data-mark"), false);
        });
        if (pending) { var n = pending; pending = null; select(n, true); }
      });
      ifr.srcdoc = srcdoc(sc, html, side);
    }
    function setState(id) {
      state = id;
      el.querySelectorAll(".states [role=tab]").forEach(function (b) { var on = b.getAttribute("data-state") === id; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
      load("before"); load("after"); renderMarks();
    }
    function show(v) {
      el.querySelectorAll(".tabs [role=tab]").forEach(function (b) { var on = b.getAttribute("data-view") === v; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
      el.querySelector('.pane[data-side="before"]').hidden = v === "after";
      el.querySelector('.pane[data-side="after"]').hidden = v === "before";
      stage.style.setProperty("--cols", v === "both" ? 2 : 1);
      frames.forEach(function (f) { if (f.screen === sc.id) fit(f); });
    }
    function arrows(tl) {
      tl.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        var tabs = Array.prototype.slice.call(tl.querySelectorAll("[role=tab]")), i = tabs.indexOf(document.activeElement);
        var nx = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length]; nx.focus(); nx.click();
      });
    }
    var tl = el.querySelector(".tabs");
    tl.addEventListener("click", function (e) {
      var b = e.target.closest("[role=tab]"); if (!b) return;
      var v = b.getAttribute("data-view"); store.set("ui-preview:view:" + sc.id, v); show(v);
    });
    arrows(tl);
    var sl = el.querySelector(".states");
    if (sl) {
      sl.addEventListener("click", function (e) { var b = e.target.closest("[role=tab]"); if (b) setState(b.getAttribute("data-state")); });
      arrows(sl);
    }

    /* A click on a line in the list scrolls to its highlight and makes it flash. */
    function select(n, scroll) {
      el.querySelectorAll(".mark").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-n") === String(n))); });
      var hit = null;
      frames.forEach(function (f) {
        if (f.screen !== sc.id || f.iframe.closest(".pane").hidden) return;
        var doc = f.iframe.contentDocument; if (!doc) return;
        doc.querySelectorAll("[data-mark]").forEach(function (x) { x.classList.toggle("flash", x.getAttribute("data-mark") === String(n)); });
        var t = doc.querySelector('[data-mark="' + n + '"]');
        if (t && !hit) hit = { f: f, t: t };
      });
      if (scroll && hit) {
        var r = hit.f.iframe.getBoundingClientRect(), y = r.top + window.scrollY + hit.t.getBoundingClientRect().top * hit.f.scale - window.innerHeight / 3;
        window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
      }
    }
    list.addEventListener("click", function (e) {
      var b = e.target.closest(".mark"); if (!b || e.target.closest("a")) return;
      var to = b.getAttribute("data-to");
      if (to) { pending = b.getAttribute("data-n"); setState(to); return; }
      select(b.getAttribute("data-n"), true);
    });
    show(mode);
    setState(state);
  });

  toggle.addEventListener("change", function () {
    showMarks = toggle.checked; store.set("ui-preview:marks", showMarks ? "on" : "off");
    frames.forEach(function (f) { var doc = f.iframe.contentDocument; if (doc && doc.documentElement) doc.documentElement.classList.toggle("marks", showMarks); });
  });
  var raf = 0;
  window.addEventListener("resize", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(function () { frames.forEach(fit); }); });

  var foot = document.createElement("footer");
  foot.innerHTML = "Mockups for <code>" + esc(D.plan_path) + "</code>" + (D.hash ? " (hash " + esc(D.hash) + ")" : "") + (D.generated ? ", generated " + esc(D.generated) : "") +
    ". Before is a reading of the code; After applies only what the plan states. Neither is the plan.";
  main.appendChild(foot);
})();
</script>

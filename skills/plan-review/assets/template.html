<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Documentation layout: top bar, section tree on the left (with the review state),
   the plan in file order in the center and the review panel on the right. Below 1180 px the panel
   goes away (progress moves to the tree); below 860 px the tree becomes a menu that opens from the top. */
:root {
  --bg: #ffffff;
  --bg-subtle: #f6f7f9;
  --bg-hover: #f0f2f5;
  --fg: #11141a;
  --fg-2: #353b47;
  --muted: #5d6471;
  --line: #e4e7ec;
  --line-strong: #cfd4dc;
  --accent: #3b4fd8;
  --accent-soft: #eef0fd;
  --ok: #157347;
  --ok-soft: #e6f4ec;
  --pend: #8f5600;
  --pend-soft: #fcf1de;
  --chg: #c0291b;
  --chg-soft: #fdebe8;
  --del: #b4321f;
  --del-soft: #fcece9;
  --add: #157347;
  --add-soft: #e6f4ec;
  --shadow: 0 1px 2px rgba(17, 20, 26, .06), 0 4px 12px rgba(17, 20, 26, .06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --bg-subtle: #15181d; --bg-hover: #1c2027; --fg: #e9ebef; --fg-2: #c3c8d1; --muted: #9098a6;
    --line: #252a32; --line-strong: #353b45; --accent: #8e9bff; --accent-soft: #1c2140;
    --ok: #55c58f; --ok-soft: #12291e; --pend: #e3ab4a; --pend-soft: #2e2412; --chg: #f2877a; --chg-soft: #351b18;
    --del: #f2877a; --del-soft: #351b18; --add: #55c58f; --add-soft: #12291e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --bg-subtle: #15181d; --bg-hover: #1c2027; --fg: #e9ebef; --fg-2: #c3c8d1; --muted: #9098a6;
  --line: #252a32; --line-strong: #353b45; --accent: #8e9bff; --accent-soft: #1c2140;
  --ok: #55c58f; --ok-soft: #12291e; --pend: #e3ab4a; --pend-soft: #2e2412; --chg: #f2877a; --chg-soft: #351b18;
  --del: #f2877a; --del-soft: #351b18; --add: #55c58f; --add-soft: #12291e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* The jump offset lives only in each target's scroll-margin; adding scroll-padding here would double it. */
html { scroll-behavior: smooth; scrollbar-color: var(--line-strong) transparent; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss03"; caret-color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--fg); }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2, h3 { margin: 0; text-wrap: balance; color: var(--fg); }
h1 { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 23px; line-height: 1.25; font-weight: 650; letter-spacing: -0.015em; }
h3 { font-size: 15.5px; line-height: 1.35; font-weight: 600; letter-spacing: -0.005em; }
p { margin: 0; max-width: 72ch; }
code { font-family: var(--mono); font-size: 0.84em; background: var(--bg-subtle); border: 1px solid var(--line); color: var(--fg); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
b { font-weight: 600; }
.ic { width: 16px; height: 16px; flex-shrink: 0; display: inline-block; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 max(20px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); font-size: 13.5px; }
.brand { font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.crumb-sep { color: var(--line-strong); }
.slug { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.hash { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.top-progress { font-variant-numeric: tabular-nums; color: var(--fg-2); font-weight: 500; }
.menu-btn { display: none; }

.page {
  max-width: 1440px; margin: 0 auto;
  display: grid; grid-template-columns: 248px minmax(0, 1fr) 232px; gap: 0 48px; align-items: start;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* section tree */
nav.toc { position: sticky; top: var(--top); min-height: calc(100vh - var(--top)); max-height: calc(100vh - var(--top)); overflow-y: auto; padding: 28px 4px 40px 0; border-right: 1px solid var(--line); margin-right: -24px; padding-right: 20px; }
.toc-title { font-size: 13px; font-weight: 600; color: var(--fg); padding: 0 10px 8px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
nav.toc a { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 6px; color: var(--fg-2); text-decoration: none; font-size: 14px; line-height: 1.4; transition: background-color .15s, color .15s; }
nav.toc a:hover { background: var(--bg-hover); color: var(--fg); }
nav.toc a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
nav.toc .sub { margin: 2px 0 4px 17px; padding-left: 8px; border-left: 1px solid var(--line); }
nav.toc .sub a { font-size: 13px; padding: 3px 10px; }
.toc-progress { margin: 16px 10px 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: none; }
/* State icon: validated (check), not reviewed (empty circle), changed since (triangle), rejected (cross), nothing to validate (dash). */
.st { width: 14px; height: 14px; flex-shrink: 0; display: inline-flex; color: var(--line-strong); }
.st svg { width: 14px; height: 14px; }
.st[data-state="ok"] { color: var(--ok); }
.st[data-state="pend"] { color: var(--pend); }
.st[data-state="chg"] { color: var(--chg); }
.st[data-state="na"] { color: var(--muted); }
.st[data-state="rej"] { color: var(--chg); }

/* review panel */
aside.rail { position: sticky; top: var(--top); max-height: calc(100vh - var(--top)); overflow-y: auto; padding: 28px 0 40px; display: grid; gap: 22px; align-content: start; font-size: 13px; }
.rail h2 { font-size: 13px; font-weight: 600; letter-spacing: 0; margin-bottom: 8px; }
.rail-count { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.rail-count span { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(10px, 1fr)); gap: 3px; margin-top: 10px; }
.cells a { height: 8px; border-radius: 2px; background: var(--line); transition: background-color .25s, transform .15s; }
.cells a:hover { transform: scaleY(1.5); }
.cells a[data-state="ok"] { background: var(--ok); }
.cells a[data-state="pend"] { background: var(--pend-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pend) 45%, transparent); }
.cells a[data-state="chg"] { background: var(--chg); }
.cells a[data-state="na"] { background: var(--line); opacity: .5; }
.cells a[data-state="rej"] { background: repeating-linear-gradient(135deg, var(--chg) 0 3px, var(--chg-soft) 3px 5px); }
.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rail li a { display: flex; align-items: center; gap: 8px; color: var(--fg-2); text-decoration: none; padding: 3px 0; }
.rail li a:hover { color: var(--accent); }
.rail .empty { color: var(--muted); }
.rail dl { margin: 0; display: grid; gap: 8px; }
.rail dt { color: var(--muted); font-size: 12px; }
.rail dd { margin: 0; color: var(--fg-2); overflow-wrap: anywhere; }
.rail dd.mono { font-family: var(--mono); font-size: 12px; }

main { display: grid; gap: 72px; min-width: 0; padding: 36px 0 96px; }

/* plan header */
.head { display: grid; gap: 14px; }
.plan-path { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; line-height: 1.4; padding: 3px 9px; border-radius: 999px; background: var(--bg-subtle); border: 1px solid var(--line); color: var(--fg-2); overflow-wrap: anywhere; }
.tag.warn { background: var(--pend-soft); border-color: color-mix(in srgb, var(--pend) 30%, transparent); color: var(--pend); font-weight: 550; }
.tag.mono { font-family: var(--mono); font-size: 12px; }
.status { background: var(--bg-subtle); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 14px; color: var(--fg-2); }
.status b.lead { color: var(--fg); margin-right: 4px; }
.status > div + div { margin-top: 6px; }
.status .muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.note:empty { display: none; }

/* section */
section.sec { display: grid; gap: 20px; scroll-margin-top: calc(var(--top) + 20px); min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.sec-head h2 { margin-right: auto; }
.tabs { display: flex; align-items: flex-end; gap: 20px; border-bottom: 1px solid var(--line); margin-top: -6px; }
.tabs [role="tab"] { all: unset; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); padding: 8px 0 9px; margin-bottom: -1px; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.tabs [role="tab"]:hover { color: var(--fg); }
.tabs [role="tab"][aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs [role="tab"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.tab-note { margin-left: auto; font-size: 12.5px; color: var(--muted); padding-bottom: 9px; text-align: right; }
.view { display: grid; gap: 20px; min-width: 0; }
.blocks { display: grid; gap: 14px; color: var(--fg-2); }
.blocks > p { color: var(--fg-2); }
pre.code, pre.mermaid { margin: 0; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: var(--bg-subtle); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; }
.lead-in { color: var(--fg); }
h3.part { margin: 8px 0 0; }
ul.ex { margin: 6px 0 0; padding-left: 18px; color: var(--fg-2); font-size: 0.94em; }
ul.ex li { margin: 2px 0; }
.conf-ref { font-size: 12.5px; color: var(--fg-2); }

/* review badge and button */
.rv { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 550; line-height: 1; padding: 5px 9px 5px 8px; border-radius: 999px; white-space: nowrap; transition: background-color .25s, color .25s; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.pend { background: var(--pend-soft); color: var(--pend); }
.badge.stale { background: var(--chg-soft); color: var(--chg); }
.badge.na { background: var(--bg-hover); color: var(--muted); }
.badge.rej { background: var(--chg-soft); color: var(--chg); }
.rv-btn { font: inherit; font-size: 13px; font-weight: 550; line-height: 1; padding: 7px 12px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); box-shadow: 0 1px 1px rgba(17, 20, 26, .04); transition: background-color .15s, border-color .15s; }
.rv-btn:hover { background: var(--bg-hover); border-color: var(--muted); }
.rv-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.rv-btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
:root[data-theme="dark"] .rv-btn.primary { color: #0e1013; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rv-btn.primary { color: #0e1013; } }
.rv-btn:disabled { opacity: .55; cursor: progress; }
/* Row review (table row, door): Confirm and Reject toggle; pressing the lit one again undoes it. */
.rv-row { display: inline-grid; gap: 6px; justify-items: start; }
.rv-row .rv-acts { display: inline-flex; gap: 4px; }
/* With the buttons on screen, the lit one already says the state: the badge only shows what they cannot (changed since). */
.rv-row.has-acts .badge:not(.stale) { display: none; }
.rv-mini { font: inherit; font-size: 12px; font-weight: 550; line-height: 1; padding: 5px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg-2); transition: background-color .15s, border-color .15s, color .15s; }
.rv-mini:hover { background: var(--bg-hover); border-color: var(--muted); }
.rv-mini.yes[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.rv-mini.no[aria-pressed="true"] { background: var(--chg-soft); border-color: var(--chg); color: var(--chg); }
.rv-mini:disabled { opacity: .55; cursor: progress; }
.stale-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 550; color: var(--chg); background: var(--chg-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }

/* plan lists */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps .n { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.notes { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.notes li::marker { color: var(--muted); }
.door-mark { font-size: 12px; font-weight: 600; color: var(--fg-2); background: var(--bg); border: 1px solid var(--line-strong); padding: 0 6px; border-radius: 4px; white-space: nowrap; }

/* tables */
/* No overflow on the table box: with it, the header cannot stick to the page while scrolling.
   Columns wrap their text and fit the width; code breaks anywhere. */
.tbl { border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-top: 1px solid var(--line); }
thead th { border-top: 0; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--bg-subtle); white-space: nowrap; }
/* Sticky header: pinned just below the bar while the table scrolls past; the bottom line is drawn as a shadow, because the border disappears in sticky mode. */
thead th { position: sticky; top: var(--top); z-index: 2; box-shadow: inset 0 -1px 0 var(--line); }
thead th:first-child { border-top-left-radius: 7px; }
thead th:last-child { border-top-right-radius: 7px; }
td { color: var(--fg-2); line-height: 1.55; }
/* Short-value columns (#, Kind, Confirmed?) stay narrow; prose columns share the rest. */
th.narrow, td.narrow { width: 1%; white-space: nowrap; }
/* Confirmed? column: the plan value becomes a badge; the literal stays for screen readers (and for the coverage check). */
.conf { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 550; line-height: 1; padding: 4px 9px 4px 6px; border-radius: 999px; white-space: nowrap; }
.conf .ic { width: 14px; height: 14px; }
.conf.yes { background: var(--ok-soft); color: var(--ok); }
.conf.no { background: var(--pend-soft); color: var(--pend); }
/* Row number: a click copies "Section #N" to cite the row in the conversation. */
.rn { all: unset; cursor: pointer; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; padding: 1px 5px; border-radius: 4px; }
.rn:hover { color: var(--accent); background: var(--accent-soft); }
.rn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
tr.row-t { scroll-margin-top: calc(var(--top) + 56px); }
tr.row-t:target td { background: var(--accent-soft); }
tr[data-rs="rej"] td { background: color-mix(in srgb, var(--chg-soft) 70%, transparent); }
tr[data-rs="ok"] td.rn-cell { box-shadow: inset 3px 0 0 var(--ok); }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* clickable cards (symptom, impact) */
.card-btn { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; gap: 6px; padding: 14px 16px; }
.card-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
.chev { color: var(--muted); transition: transform .2s cubic-bezier(.2, .8, .2, 1); margin-top: 2px; }
[aria-expanded="true"] .chev { transform: rotate(180deg); }
.detail { padding: 0 16px 14px; font-size: 14px; }
.detail dl { margin: 0; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.detail dt { color: var(--muted); font-size: 13px; font-weight: 500; }
.detail dd { margin: 0; overflow-wrap: anywhere; color: var(--fg-2); }
.where-list { display: flex; flex-wrap: wrap; gap: 4px; }
.where-list code { white-space: normal; overflow-wrap: break-word; }
.where-lead { flex-basis: 100%; color: var(--fg-2); }
.where-note { color: var(--muted); font-size: 13.5px; margin: 0 6px 0 2px; }
a.xref { font-weight: 600; text-decoration: none; border-radius: 3px; }
a.xref:hover { text-decoration: underline; }
a.door-mark.xref { color: var(--accent); }
.acs li, .door, .slice { scroll-margin-top: calc(var(--top) + 20px); }
.acs li:target { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); border-radius: 2px; }
.door:target, .slice:target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* Problem */
.pay-filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.pay-btn { font: inherit; font-size: 14px; line-height: 1.45; text-align: left; cursor: pointer; color: var(--fg-2); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; transition: border-color .15s, background-color .15s; }
.pay-btn:hover { border-color: var(--line-strong); background: var(--bg-subtle); }
.pay-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); box-shadow: 0 0 0 1px var(--accent); }
/* Problem symptoms and Impact cards as a list, not a grid: every row has the same structure
   (title, content, tag, chevron) and opening a row expands it in place, without reshuffling the others. */
.syms, .imps { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sym, .imp { min-width: 0; border-top: 1px solid var(--line); transition: opacity .2s, background-color .15s; }
.sym:first-child, .imp:first-child { border-top: 0; }
.sym-btn { grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) auto 16px; gap: 6px 20px; align-items: baseline; padding: 12px 16px; transition: background-color .15s; }
.imp-btn { grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) minmax(0, 12rem) 16px; gap: 6px 20px; align-items: baseline; padding: 12px 16px; transition: background-color .15s; }
.sym-btn:hover, .imp-btn:hover { background: var(--bg-subtle); }
.sym.open, .imp.open { background: var(--bg-subtle); }
.sym-what, .imp-what { font-weight: 600; color: var(--fg); }
.imp-mid { display: grid; gap: 4px; justify-items: start; min-width: 0; }
/* The chevron stays on the title line, even when the row is tall. */
.sym-btn .chev, .imp-btn .chev { align-self: start; margin-top: 3px; }
.sym.hit .sym-what { color: var(--accent); }
.sym.dim, .imp.dim { opacity: .35; }
/* An open card takes the whole row: the detail is not squeezed into a column. */
.sym .today { color: var(--fg-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sym .detail { padding: 0 16px 14px; }
.fix-tag { font-size: 12.5px; font-weight: 550; color: var(--ok); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.fix-link { font-weight: 600; text-decoration: none; }
.callout { background: var(--bg-subtle); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; color: var(--fg-2); }
.callout b:first-child { color: var(--fg); }
.hint { font-size: 13px; color: var(--muted); }

/* Flow */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }

      (pays.length ? '<p class="hint">Click who pays to see what hits them; click a symptom to see where it is and what fixes it.</p>' : "") +
      (v.why_now ? '<div class="callout"><b>Why now:</b> ' + md(v.why_now) + "</div>" : "") +
      (v.outcome ? '<div class="callout"><b>Once shipped:</b> ' + md(v.outcome) + "</div>" : "");
    var el = section(s, html, blocks(s.blocks, s));
    var box = el.querySelector(".syms");
    function fixHtml(f) {
      if (!f) return "";
      return '<a class="fix-link" href="#slice-' + esc(f.slice) + '">' + esc(f.slice) + "</a> · " + proof(f.proof) + doorLink(f.door) + (f.text ? " · " + md(f.text) : "");
    }
    function render() {
      box.innerHTML = syms.map(function (x, i) {
        var open = !!st.open[i];
        var dim = st.pay !== null && (x.pays || []).indexOf(st.pay) === -1;
        return '<article class="sym' + (open ? " open" : "") + (dim ? " dim" : "") + (st.pay !== null && !dim ? " hit" : "") + '">' +
          '<button type="button" class="sym-btn card-btn" data-i="' + i + '" aria-expanded="' + open + '"><span class="sym-what">' + esc(x.what) + staleTag("symptom:" + i) + "</span>" +
          '<span class="today">' + (open ? "" : md(x.today)) + "</span>" + '<span class="fix-tag">' + (x.fix ? "Fixed in " + esc(x.fix.slice) : "") + "</span>" + IC.chev + "</button>" +
          (open ? '<div class="detail">' + dl([["Where", whereList(x.where)], ["Today", md(x.today)], ["Fixed in", fixHtml(x.fix)],
            ["Who pays", (x.pays || []).map(function (p) { return md(pays[p]); }).join("<br>")]]) + "</div>" : "") +
          "</article>";
      }).join("");
    }
    render();
    el.addEventListener("click", function (e) {
      var pb = e.target.closest(".pay-btn");
      if (pb) {
        var p = Number(pb.getAttribute("data-p"));
        st.pay = st.pay === p ? null : p;
        el.querySelectorAll(".pay-btn").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-p")) === st.pay)); });
        render();
        return;
      }
      var b = e.target.closest(".sym-btn"); if (!b) return;
      var i = b.getAttribute("data-i"); st.open[i] = !st.open[i]; render();
      var again = el.querySelector('.sym-btn[data-i="' + i + '"]'); if (again) again.focus();
    });
  }

  /* Flow: clickable paths. A part of a section: `html` goes into the Visual tab, `bind` wires it once
     the section exists. Shape carries it (Flow in older plans). */
  function flowPart(s) {
    var v = EN.flow_visual;
    if (!v) return null;
    var intro = (s.blocks || []).filter(function (b) { return b.type === "p"; })[0];
    var st = { sel: null };
    // Where each changing node appears: its card opens in one place, and the other occurrences light up with it.
    // Every copy opens the same card: `change` comes from the occurrence that carries it in the data.
    var seen = {}, cardOf = {};
    v.paths.forEach(function (p, pi) {
      p.nodes.forEach(function (x, ni) {
        if (x.o || x.note) (seen[x.n] = seen[x.n] || []).push(pi + "-" + ni);
        if (x.change != null && !(x.n in cardOf)) cardOf[x.n] = x.change;
      });
    });
    function cardIdx(x) { return x.change != null ? x.change : cardOf[x.n]; }
    var repeats = Object.keys(seen).some(function (n) { return seen[n].length > 1; });
    var html = (intro ? '<p class="lead-in">' + md(intro.text) + "</p>" : "") +
      '<div class="toolbar"><button type="button" class="switch flow-focus" aria-pressed="false"><span class="track"></span>Highlight only what changes</button>' +
      '<span class="legend"><span><i class="add"></i>changes: click to see where, why and proof</span><span>struck through = the name today</span>' +
      (repeats ? '<span><i class="same"></i>the same node in another path</span>' : "") + '</span></div><div class="paths"></div>';
    var el, box;
    function selNode() {
      if (!st.sel) return null;
      var at = st.sel.split("-");
      return v.paths[+at[0]].nodes[+at[1]];
    }
    function node(x, key, selN) {
      var changed = !!(x.o || x.note);
      var same = changed && selN != null && x.n === selN && key !== st.sel;
      var inner = '<span class="nk">' + esc(x.k) + doorMark(x.d) + "</span>" + (x.o ? '<span class="no' + pr(x.o) + '">' + esc(x.o) + "</span>" : "") +
        newName(x.n, x.tbd, "nn") + (x.note ? '<span class="nnote">' + esc(x.note) + "</span>" : "");
      if (!changed) return '<div class="node">' + inner + "</div>";
      if (cardIdx(x) == null) return '<div class="node changed' + (same ? " same" : "") + '"' + (same ? ' title="The same node as the open card"' : "") + ">" + inner + "</div>";
      return '<button type="button" class="node changed node-btn' + (same ? " same" : "") + '" data-key="' + key + '" aria-expanded="' + (st.sel === key) + '">' + inner + "</button>";
    }
    function render() {
      var cur = selNode(), selN = cur ? cur.n : null;
      box.classList.toggle("picking", !!cur);
      box.innerHTML = v.paths.map(function (p, pi) {
        var sel = null, hasSame = false;
        var chain = p.nodes.map(function (x, ni) {
          var key = pi + "-" + ni; if (st.sel === key) sel = x;
          if (selN != null && x.n === selN && key !== st.sel && (x.o || x.note)) hasSame = true;
          return ni === 0 ? node(x, key, selN) : '<span class="unit"><span class="sep">' + IC.arrow + "</span>" + node(x, key, selN) + "</span>";
        }).join("");
        var panel = sel ? changeDetail(CHANGES[cardIdx(sel)], [["Before", "<code>" + esc(sel.o || sel.n) + "</code>"], ["After", newNameText(sel.n, sel.tbd) + (sel.note ? " · " + esc(sel.note) : "")]]) : "";
        return '<div class="path' + (hasSame ? " has-same" : "") + '"><div class="path-head"><h3>' + esc(p.title) + "</h3>" + staleTag("flow:" + pi) + '<span class="when">' + esc(p.when || "") + (p.hop ? " · plan hop " + p.hop : "") + '</span></div><div class="chain">' + chain + "</div>" + panel + "</div>";
      }).join("");
    }
    return { html: html, bind: function (sec) {
      el = sec; box = el.querySelector(".paths");
      render();
      el.querySelector(".flow-focus").addEventListener("click", function (e) {
        var on = e.currentTarget.getAttribute("aria-pressed") !== "true";
        e.currentTarget.setAttribute("aria-pressed", String(on));
        box.classList.toggle("focus", on);
      });
      el.addEventListener("click", function (e) {
        var b = e.target.closest(".node-btn"); if (!b) return;
        var k = b.getAttribute("data-key");
        st.sel = st.sel === k ? null : k;
        render();
        var again = el.querySelector('.node-btn[data-key="' + k + '"]'); if (again) again.focus();
      });
    } };
  }

  /* The table each Impact card reads: Shape's "Changes underneath" (first header `Front`), or the
     first Impact table in older plans. build_page.py (underneath_table) uses the same rule. */
  function underneathTable(s) {
    var tables = (s.blocks || []).filter(function (b) { return b.type === "table"; });
    return tables.filter(function (t) { return String(t.header[0] || "").trim().toLowerCase() === "front"; })[0] || tables[0];
  }
  /* Impact: cards by group, "who feels it" filter. A part, like flowPart: Shape carries it (Impact in older plans). */
  function impactPart(s) {
    var v = EN.impact_visual;
    if (!v) return null;
    var t = underneathTable(s);
    var rows = (t || { rows: [] }).rows;
    /* Each card is a reading of one table row: it shows the row number and its review, so it can be confirmed from the Visual tab. */
    var rowKeys = rowsAt(s, s.blocks.indexOf(t)) || [];
    var st = { aud: null, open: {} };
    var auds = v.audiences || [];
    var html = (auds.length ? '<div class="aud"><span class="lbl">Who feels it</span><button type="button" class="chip" data-a="" aria-pressed="true">All</button>' +
      auds.map(function (a) { return '<button type="button" class="chip" data-a="' + esc(a) + '" aria-pressed="false">' + esc(a) + "</button>"; }).join("") + "</div>" : "") +
      '<div class="groups"></div><p class="hint">Click a card to see where, why, proof and the plan text for that row.</p>';
    var el, box;
    function card(c, i) {
      var open = !!st.open[i];
      var dim = st.aud && (c.who || []).indexOf(st.aud) === -1;
      var detail = "";
      if (open) {
        detail = '<div class="imp-detail detail">' + dl([["Where", whereList(c.where)], ["Why", esc(c.why)], ["Proof", proof(c.proof)]]);
        // What stays: each name is its own code chip; the reason shows files and identifiers as code.
        if (c.keep && v.keep) detail += '<ul class="keep">' + v.keep.map(function (k) {
          return '<li><span class="keep-names">' + String(k[0]).split(/\s+·\s+/).map(function (n) { return "<code>" + esc(n) + "</code>"; }).join("") +
            '</span><span class="why">' + codeText(k[1]) + "</span></li>";
        }).join("") + "</ul>";
        if (c.tree && v.tree) detail += '<div class="trees"><div class="tree"><h3>Before</h3><div class="tree-lines">' + treeHtml(v.tree.before) + '</div></div><div class="tree"><h3>After</h3><div class="tree-lines">' + treeHtml(v.tree.after) + "</div></div></div>";
        var r = rows[c.row], rk = rowKeys[c.row];
        if (r) detail += '<div class="plan-text"><b class="lead">Plan text · ' + esc(r[0]) + "</b>" + md(r.slice(1).join(" · ")) + "</div>";
        if (rk) detail += '<div class="imp-rv"><span class="lbl">' + esc(s.name) + " #" + esc(rk.n) + "</span>" + rowSlot(rk.key) + "</div>";
        detail += "</div>";
      }
      return '<article class="imp ' + esc(c.g) + (open ? " open" : "") + (dim ? " dim" : "") + '"><button type="button" class="imp-btn card-btn" data-i="' + i + '" aria-expanded="' + open + '">' +
        '<span class="imp-what">' + (rowKeys[c.row] ? '<span class="st" data-rk-dot="' + esc(rowKeys[c.row].key) + '"></span><span class="imp-n">#' + esc(rowKeys[c.row].n) + "</span>" : "") +
        esc(c.title) + staleTag("impact:" + i) + "</span>" + '<span class="imp-mid">' +
        (c.before || c.after ? '<span class="ba">' + (c.before ? '<span class="name old' + pr(c.before) + '">' + esc(c.before) + "</span>" : "") + '<span class="ba-new">' + (c.before ? '<span class="arrow">' + IC.arrow + "</span>" : "") + newName(c.after, c.tbd, "name new") + "</span></span>" : "") +
        (c.risk ? '<span class="risk"><b>Risk:</b> ' + esc(c.risk) + "</span>" : "") + "</span>" +
        '<span class="who">' + (c.who || []).map(function (w) { return "<span>" + esc(w) + "</span>"; }).join("") + "</span>" + IC.chev + "</button>" + detail + "</article>";
    }
    function render() {
      box.innerHTML = (v.groups || []).map(function (g) {
        var cs = v.cards.map(function (c, i) { return [c, i]; }).filter(function (p) { return p[0].g === g[0]; });
        if (!cs.length) return "";
        return '<div class="group"><div class="group-head ' + esc(g[0]) + '"><i></i><h3>' + esc(g[1]) + '</h3><span class="gcount">' + cs.length + "</span></div>" +
          '<div class="imps">' + cs.map(function (p) { return card(p[0], p[1]); }).join("") + "</div></div>";
      }).join("");
      paintReview();
    }
    return { html: html, bind: function (sec) {
      el = sec; box = el.querySelector(".groups");
      render();
      var audBox = el.querySelector(".aud");
      if (audBox) audBox.addEventListener("click", function (e) {
        var b = e.target.closest(".chip"); if (!b) return;
        st.aud = b.getAttribute("data-a") || null;
        audBox.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        render();
      });
      el.addEventListener("click", function (e) {
        var b = e.target.closest(".imp-btn"); if (!b) return;
        var i = b.getAttribute("data-i"); st.open[i] = !st.open[i]; render();
        var again = el.querySelector('.imp-btn[data-i="' + i + '"]'); if (again) again.focus();
      });
    } };
  }

  /* A section built from parts: without any, only the plan text. Flow and Impact (older plans)
     carry one part each; Shape carries the path, then the changes underneath. */
  function renderParts(s, parts) {
    var heads = parts.length > 1 ? ["The path", "Changes underneath"] : [];
    var live = parts.map(function (p, i) { return p && { p: p, head: heads[i] }; }).filter(Boolean);
    if (!live.length) return section(s, blocks(s.blocks, s));
    var el = section(s, live.map(function (x) { return (x.head ? '<h3 class="part">' + x.head + "</h3>" : "") + x.p.html; }).join(""), blocks(s.blocks, s));
    live.forEach(function (x) { x.p.bind(el); });
  }

  /* Landing: one card per one-way door.
     With `landing_visual`, the Visual tab explains each door in plain language (it holds the
     "Confirm" button and the door-N id); the plan table stays in the "Plan text" tab. */
  function renderLanding(s) {
    var t = firstTable(s);
    if (!t || !/one-way door/i.test(t.header[0] || "")) return section(s, blocks(s.blocks, s));
    var lv = EN.landing_visual, byN = {};
    ((lv && lv.doors) || []).forEach(function (d) { byN[String(d.n)] = d; });
    var rest = s.blocks.filter(function (b) { return b !== t; });
    /* Door N is the N-th row of the Landing table (the canonical tlc-spec-lean format, and how
       build_page.py numbers the door:N fingerprints). A legacy "N. name" first cell gives N and the title. */
    function head(r, i) { var m = /^(\d+)\.\s*(.*)$/.exec(r[0]); return { n: m ? m[1] : String(i + 1), title: m ? m[2] : r[0] }; }
    function planCard(r, i, live) {
      var h = head(r, i), n = h.n;
      return '<article class="door"' + (live && n ? ' id="door-' + esc(n) + '"' : "") + '><div class="door-head"><h3><span class="n">One-way door ' + esc(n) + "</span> · " + md(h.title) + "</h3>" +
        (live && n ? rowSlot("door:" + n) : "") + "</div>" +
        '<div class="field"><h4>' + esc(t.header[1] || "Literal shape") + '</h4><div class="shape">' + md(r[1] || "") + "</div></div>" +
        '<div class="field"><h4>' + esc(t.header[2] || "Alternative rejected") + "</h4><p>" + md(r[2] || "") + "</p></div></article>";
    }
    if (!lv) return section(s, t.rows.map(function (r, i) { return planCard(r, i, true); }).join("") + blocks(rest, s));
    function field(label, html) { return '<div class="field"><h4>' + esc(label) + "</h4>" + html + "</div>"; }
    function para(x) { return "<p>" + codeText(x) + "</p>"; }
    var visual = (lv.intro ? '<div class="callout">' + md(lv.intro) + "</div>" : "") + t.rows.map(function (r, i) {
      var h = head(r, i), n = h.n, d = byN[n] || {};
      return '<article class="door door-v" id="door-' + esc(n) + '"><div class="door-head"><h3><span class="n">One-way door ' + esc(n) + "</span> · " + esc(d.title || h.title) + "</h3>" +
        staleTag("landing:" + n) + rowSlot("door:" + n) + "</div>" +
        (d.decide ? field("What is decided", para(d.decide)) : "") +
        (d.choice ? field("What we chose", para(d.choice) + (d.names ? '<div class="keep-names">' + d.names.map(function (x) { return "<code>" + esc(x) + "</code>"; }).join("") + "</div>" : "")) : "") +
        (d.hard ? field("Why it is hard to undo", para(d.hard)) : "") +
        (d.risk ? field("On deploy", para(d.risk)) : "") +
        (d.alternatives ? field("What was rejected", '<ul class="alts">' + d.alternatives.map(function (a) { return "<li><b>" + codeText(a[0]) + "</b><span>" + codeText(a[1]) + "</span></li>"; }).join("") + "</ul>") : "") +
        (d.proof ? field("Proof", "<p>" + proof(d.proof) + "</p>") : "") + "</article>";
    }).join("") + blocks(rest, s, true);
    return section(s, visual, t.rows.map(function (r, i) { return planCard(r, i, false); }).join("") + blocks(rest, s));
  }

  /* Criteria: slices, criteria and each slice's changes */
  function renderCriteria(s) {
    var c = s.criteria;
    var kinds = [];
    CHANGES.forEach(function (x) { if (x.k && kinds.indexOf(x.k) === -1) kinds.push(x.k); });
    var warnKinds = EN.warn_kinds || [];
    var filter = CHANGES.length ? '<div class="filters"><span class="lbl">Changes</span><button type="button" class="chip" data-k="" aria-pressed="true">All kinds</button>' +
      kinds.map(function (k) { return '<button type="button" class="chip" data-k="' + esc(k) + '" aria-pressed="false">' + esc(k) + "</button>"; }).join("") +
      '<input class="search" type="search" placeholder="Search name, file…" aria-label="Search changes"><span class="count"></span></div>' : "";
    var html = blocks(c.intro) + (CHANGES.length ? '<p class="hint">Each slice lists its changes below its criteria; click a row to see where, why and proof.</p>' : "") + filter +
      c.slices.map(function (sl) {
        return '<article class="slice" id="slice-' + esc(sl.id) + '"><div class="slice-head"><span class="sid">' + esc(sl.id) + "</span><h3>" + md(sl.title) + '</h3><span class="prio">' + esc(sl.prio) + "</span>" +
          reviewSlot(sl.id, "validated") + "</div>" +
          '<div class="slice-body">' + blocks(sl.desc) + '<h4>Acceptance Criteria</h4><ol class="acs">' +
          sl.acs.map(function (a) { return '<li id="ac-' + a.n + '"><span class="n">' + a.n + ".</span><span>" + linkDoors(md(a.text) + examples(a)) + "</span></li>"; }).join("") + "</ol>" +
          (sl.indep ? '<div class="indep"><b>Independent test:</b> ' + md(sl.indep) + "</div>" : "") + blocks(sl.extra) + "</div>" +
          '<div class="renames" data-slice="' + esc(sl.id) + '"></div></article>';
      }).join("");
    var el = section(s, html);
    var st = { kind: "", q: "", open: {} };
    function matches(x) {
      if (st.kind && x.k !== st.kind) return false;
      if (st.q && ((x.old || "") + " " + x.neu + " " + (x.where || "") + " " + (x.why || "")).toLowerCase().indexOf(st.q) === -1) return false;
      return true;
    }
    function render() {
      var shown = 0;
      el.querySelectorAll(".renames").forEach(function (box) {
        var sid = box.getAttribute("data-slice");
        var all = CHANGES.map(function (x, i) { return [x, i]; }).filter(function (p) { return p[0].s === sid; });
        if (!all.length) { box.innerHTML = CHANGES.length ? '<div class="none">' + esc((EN.slice_notes || {})[sid] || "No changes listed for this slice.") + "</div>" : ""; return; }
        var rows = all.filter(function (p) { return matches(p[0]); });
        shown += rows.length;
        var h = '<h4 class="renames-title">Changes in this slice</h4>';
        if (!rows.length) h += '<div class="none">No change in this slice matches the filter.</div>';
        rows.forEach(function (p) {
          var x = p[0], i = p[1], open = !!st.open[i];
          h += '<div class="row"><button type="button" class="row-btn' + (x.old ? "" : " single") + '" aria-expanded="' + open + '" data-i="' + i + '">' +
            (x.old ? '<span class="name old' + pr(x.old) + '">' + esc(x.old) + '</span><span class="arrow">' + IC.arrow + "</span>" : "") + newName(x.neu, x.tbd, "name new") + staleTag("change:" + i) +
            (x.k ? '<span class="kind' + (warnKinds.indexOf(x.k) !== -1 ? " warn" : "") + '">' + esc(x.k) + "</span>" : "<span></span>") + IC.chev + "</button>" +
            (open ? changeDetail(x) : "") + "</div>";
        });
        box.innerHTML = h;
      });
      var cnt = el.querySelector(".filters .count"); if (cnt) cnt.textContent = shown + " of " + CHANGES.length;
    }
    var f = el.querySelector(".filters");
    if (f) {
      f.addEventListener("click", function (e) {
        var b = e.target.closest(".chip"); if (!b) return;
        st.kind = b.getAttribute("data-k");
        f.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        render();
      });
      f.querySelector(".search").addEventListener("input", function (e) { st.q = e.target.value.trim().toLowerCase(); render(); });
    }
    el.addEventListener("click", function (e) {
      var b = e.target.closest(".row-btn"); if (!b) return;
      var i = b.getAttribute("data-i"); st.open[i] = !st.open[i]; render();
      var again = el.querySelector('.row-btn[data-i="' + i + '"]'); if (again) again.focus();
    });
    render();
  }

  /* ---------- page assembly ---------- */
  var planPath = EN.plan_path || PLAN.path;
  var slugM = /features\/([^/]+)\//.exec(planPath || "");
  document.getElementById("slug").textContent = slugM ? slugM[1] : (planPath || "");
  document.getElementById("top-hash").textContent = PLAN.hash ? "plan.md " + PLAN.hash : "";
  document.getElementById("plan-path").textContent = planPath;
  document.getElementById("plan-title").textContent = PLAN.title;
  /* Approval is the user's word, written by tlc-spec-lean under the title; validating on this page is not it.
     Older plans carry a `**Status**:` line instead (or as well). */
  function statusLine(lead, html) { return '<div><b class="lead">' + lead + "</b> " + html + "</div>"; }
  document.getElementById("status").innerHTML =
    (PLAN.approved ? statusLine("Approved:", md(PLAN.approved)) : PLAN.status ? "" : statusLine("Approved:", '<span class="muted">not yet: the plan is in review</span>')) +
    (PLAN.status ? statusLine("Status:", md(PLAN.status)) : "");
  document.getElementById("tags").innerHTML = (EN.tags || []).map(function (t) { return '<span class="tag' + (t.warn ? " warn" : "") + '">' + esc(t.text) + "</span>"; }).join("") +
    (PLAN.hash ? '<span class="tag mono" title="Hash of the plan.md this page was generated from. If the current plan.md has a different hash, the page is out of date.">plan.md ' + esc(PLAN.hash) + (PLAN.generated ? " · generated " + esc(PLAN.generated) : "") + "</span>" : "");

  SECTIONS.forEach(function (s) {
    if (s.id === "problem") return renderProblem(s);
    if (s.id === "shape") return renderParts(s, [flowPart(s), impactPart(s)]);
    if (s.id === "flow") return renderParts(s, [flowPart(s)]);
    if (s.id === "impact") return renderParts(s, [impactPart(s)]);
    if (s.id === "landing") return renderLanding(s);
    if (s.id === "criteria") return renderCriteria(s);
    section(s, blocks(s.blocks, s));
  });

  var foot = document.createElement("footer");
  foot.innerHTML = "Mirror of <code>" + esc(planPath) + "</code>" + (PLAN.hash ? " (hash " + esc(PLAN.hash) + ")" : "") + (PLAN.generated ? ", generated " + esc(PLAN.generated) : "") +
    ". Section text comes from the plan; Where, Why and Proof come from reading the code" + (EN.code_ref ? " at " + esc(EN.code_ref) : "") + ".";
  main.appendChild(foot);

  document.getElementById("toc").innerHTML = SECTIONS.map(function (s) {
    var dot = s.empty ? '<span class="st" data-state="na" title="nothing to validate">' + IC.na + "</span>" : '<span class="st" data-rk-dot="' + esc(s.id) + '"></span>';
    var li = '<li><a href="#' + esc(s.id) + '" data-sec="' + esc(s.id) + '">' + dot + "<span>" + esc(s.name) + "</span></a>";
    if (s.criteria) li += '<ol class="sub">' + s.criteria.slices.map(function (x) { return '<li><a href="#slice-' + esc(x.id) + '"><span class="st" data-rk-dot="' + esc(x.id) + '"></span><span>' + esc(x.id) + "</span></a></li>"; }).join("") + "</ol>";
    return li + "</li>";
  }).join("");
  document.getElementById("rail-cells").innerHTML = SECTIONS.map(function (s) {
    return '<a href="#' + esc(s.id) + '" ' + (s.empty ? 'data-state="na" title="' + esc(s.name) + ': nothing to validate"' : 'data-rk-dot="' + esc(s.id) + '"') + "></a>";
  }).join("");
  document.getElementById("rail-meta").innerHTML =
    (PLAN.hash ? '<dt>plan.md</dt><dd class="mono">' + esc(PLAN.hash) + "</dd>" : "") +
    (PLAN.generated ? "<dt>Generated</dt><dd>" + esc(PLAN.generated) + "</dd>" : "") +
    (EN.code_ref ? "<dt>Code read</dt><dd>" + esc(EN.code_ref) + "</dd>" : "");

  /* Section menu on phones. */
  var nav = document.getElementById("toc-nav"), menu = document.getElementById("menu-btn");
  function setMenu(open) { nav.classList.toggle("open", open); menu.setAttribute("aria-expanded", String(open)); }
  menu.addEventListener("click", function () { setMenu(!nav.classList.contains("open")); });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && nav.classList.contains("open")) { setMenu(false); menu.focus(); } });

  /* Current section in the tree: the last section (and, in Criteria, the last slice) whose top has passed
     the line just below the bar. At the bottom of the page, the last section that starts in the top two
     thirds of the screen. A click on an internal link marks the target at once and holds it until scrolling stops. */
  var tocLinks = {};
  document.querySelectorAll("nav.toc a[href^='#']").forEach(function (a) { tocLinks[a.getAttribute("href").slice(1)] = a; });
  var spyLock = false, spyTimer = null, spyFrame = 0;
  function markToc(ids) {
    Object.keys(tocLinks).forEach(function (k) { tocLinks[k].setAttribute("aria-current", String(ids.indexOf(k) !== -1)); });
  }
  function spy() {
    spyFrame = 0;
    if (spyLock) return;
    var bar = document.querySelector(".topbar"), line = (bar ? bar.offsetHeight : 52) + 80;
    var secs = [].slice.call(document.querySelectorAll("section.sec"));
    if (!secs.length) return;
    var cur = secs[0];
    secs.forEach(function (sec) { if (sec.getBoundingClientRect().top <= line) cur = sec; });
    var doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 4) {
      secs.forEach(function (sec) { if (sec.getBoundingClientRect().top < window.innerHeight * 2 / 3) cur = sec; });
    }
    var ids = [cur.id];
    if (cur.id === "criteria") {
      var sl = null;
      cur.querySelectorAll(".slice").forEach(function (x) { if (x.getBoundingClientRect().top <= line) sl = x; });
      if (sl) ids.push(sl.id);
    }
    markToc(ids);
  }
  function releaseSpy() { spyLock = false; spyTimer = null; }
  window.addEventListener("scroll", function () {
    if (spyLock) { clearTimeout(spyTimer); spyTimer = setTimeout(releaseSpy, 200); return; }
    if (!spyFrame) spyFrame = (window.requestAnimationFrame || setTimeout)(spy);
  }, { passive: true });
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[href^='#']"); if (!a) return;
    var target = document.getElementById(a.getAttribute("href").slice(1)); if (!target) return;
    var sec = target.closest("section.sec"), sl = target.closest(".slice");
    if (!sec) return;
    markToc(sl ? [sec.id, sl.id] : [sec.id]);
    spyLock = true; clearTimeout(spyTimer); spyTimer = setTimeout(releaseSpy, 1000);
  });
  spy();

  paintReview();
  var note = document.getElementById("review-note");
  function say(t) { if (note) note.textContent = t; }
  var api = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if (api) {
    api.use("db").then(function (db) {
      if (!db) return;
      DB = db;
      db.collection("review").onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (d) { if (d.exists) m[d.id] = d.data(); });
        DBREV = m;
        paintReview();
      }, function () { say("The validations for this page could not be loaded right now."); });
      return api.use("user").then(function (user) {
        if (!user) return;
        return Promise.all([user.canEdit(), user.id()]).then(function (v) {
          CAN_WRITE = !!v[0]; ME = v[1];
          paintReview();
          say(CAN_WRITE ? "What you validate or confirm here is saved on this page." : "Only editors of this page can validate.");
        });
      });
    });
  }
  /* Review order: sections in plan order, with the doors inside Landing and the slices inside Criteria. */
  function reviewOrder() {
    var out = [];
    TO_REVIEW.forEach(function (s) {
      out.push([s.id, s.name, "#" + s.id]);
      if (s.id === "landing") Object.keys(FP).filter(function (k) { return k.indexOf("door:") === 0; })
        .sort(function (a, b) { return Number(a.slice(5)) - Number(b.slice(5)); })
        .forEach(function (k) { out.push([k, "One-way door " + k.slice(5), "#door-" + k.slice(5)]); });
      if (s.criteria) s.criteria.slices.forEach(function (x) { out.push([x.id, x.id, "#slice-" + x.id]); });
    });
    return out;
  }
  var toastTimer = null;
  function toast(html) {
    var t = document.getElementById("toast"); if (!t) return;
    t.innerHTML = html; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 8000);
  }
  /* After validating: points to the next pending item, starting from the one just validated. */
  function nextToast(key) {
    var order = reviewOrder(), at = order.map(function (o) { return o[0]; }).indexOf(key);
    var done = order[at] ? order[at][1] : key, isDoor = key.indexOf("door:") === 0;
    for (var i = 1; i < order.length; i++) {
      var o = order[(at + i) % order.length];
      if (stateOf(o[0]) !== "ok") {
        toast("<span>" + esc(done) + (isDoor ? " confirmed." : " validated.") + '</span><span>Next to review: <a href="' + esc(o[2]) + '">' + esc(o[1]) + "</a></span>");
        return;
      }
    }
    toast("<span>" + esc(done) + (isDoor ? " confirmed." : " validated.") + " Everything is reviewed.</span>");
  }
  document.addEventListener("click", function (e) { if (e.target.closest("#toast a")) document.getElementById("toast").hidden = true; });
  /* Copy: the clipboard may be blocked in the artifact iframe; the legacy method covers that case. */
  function legacyCopy(t) {
    var ta = document.createElement("textarea"), ok = false;
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok ? Promise.resolve() : Promise.reject(new Error("copy"));
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function () { return legacyCopy(t); });
    return legacyCopy(t);
  }
  document.addEventListener("click", function (e) {
    var c = e.target.closest(".copy-btn"); if (!c) return;
    var text = c.getAttribute("data-copy");
    copyText(text).then(function () {
      c.classList.add("done"); c.innerHTML = IC.check; c.setAttribute("aria-label", "Copied: " + text);
      setTimeout(function () { c.classList.remove("done"); c.innerHTML = IC.copy; c.setAttribute("aria-label", "Copy " + text); }, 1500);
    }, function () { toast("<span>Could not copy. Select the text and copy it by hand.</span>"); });
  });
  function mark(keys, state) {
    var at = new Date().toISOString();
    return Promise.all(keys.map(function (k) { return DB.doc("review/" + k).set({ state: state, fp: FP[k] || null, plan: PLAN.hash || null, by: ME, at: at }); }));
  }
  function failed(err) { say("Could not save (" + ((err && err.code) || "error") + "). Try again."); }
  /* Section or slice: Validate also confirms every row of the section (rejected ones included); Undo takes them all back to pending. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".rv-btn");
    if (!b || !DB || !CAN_WRITE) return;
    var key = b.getAttribute("data-rk-btn"), r = fullOf(key);
    var next = r.st === "ok" && !r.changed ? "pending" : "validated";
    b.disabled = true;
    mark([key].concat(secRows(key)), next)
      .then(function () { b.disabled = false; say(""); if (next === "validated") nextToast(key); })
      .catch(function (err) { b.disabled = false; failed(err); });
  });
  /* Table row or door: Confirm / Reject; pressing the one already lit takes it back to pending. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".rv-mini");
    if (!b || !DB || !CAN_WRITE) return;
    var key = b.getAttribute("data-rk-row-btn"), yes = b.getAttribute("data-act") === "yes", r = reviewOf(key);
    var next = !r.changed && r.st === (yes ? "ok" : "rej") ? "pending" : yes ? "validated" : "rejected";
    b.disabled = true;
    mark([key], next)
      .then(function () {
        b.disabled = false; say("");
        if (next === "rejected") toast("<span>" + esc(rowLabel(key)) + " rejected.</span><span>Cite <b>" + esc(rowLabel(key)) + "</b> in the conversation to say what is wrong.</span>");
        else if (next === "validated" && isDoor(key)) nextToast(key);
      })
      .catch(function (err) { b.disabled = false; failed(err); });
  });
  /* Row number: copies "Section #N", to cite the row in the conversation. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".rn"); if (!b) return;
    var ref = b.getAttribute("data-ref");
    copyText(ref).then(function () { toast("<span>Copied <b>" + esc(ref) + "</b>: paste it in the conversation to discuss this row.</span>"); },
      function () { toast("<span>Cite this row as <b>" + esc(ref) + "</b>.</span>"); });
  });
  /* A link to a row inside a hidden "Plan text" tab (Impact) opens that tab first, so the jump has a target on screen. */
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[href^='#row-']"); if (!a) return;
    var t = document.getElementById(a.getAttribute("href").slice(1)), view = t && t.closest(".view[hidden]");
    if (!view) return;
    var tab = document.getElementById(view.getAttribute("aria-labelledby")); if (tab) tab.click();
  }, true);
})();
</script>

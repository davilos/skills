name: Snyk

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENT_SCAN_VERSION: "0.6.9"

jobs:
  agent-scan:
    name: Agent Scan (skills)
    # Forks don't receive SNYK_TOKEN, so skip their PRs instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Scan skills for prompt injection, malicious code and secrets
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: uvx "snyk-agent-scan@${AGENT_SCAN_VERSION}" --ci skills

  snyk-code:
    name: Snyk Code (scripts)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: snyk/actions/setup@v1.0.0
      - name: Static analysis of skill scripts
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif
      - name: Upload results to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
